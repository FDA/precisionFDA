# Volumes must be declared in leaf compose files; `extends` does not inherit them.
volumes:
  bundler-deps-cache-ruby:
  db-pfda-mysql-volume:
  vite-cache-client:
  # pnpm's content-addressed store — safe to share across all Node services.
  pnpm-store-cache:
  # node_modules trees must stay per-service (project-specific symlink layout).
  pnpm-deps-cache-client:
  pnpm-deps-cache-nodejs-api:
  pnpm-deps-cache-nodejs-worker:
  pnpm-deps-cache-nodejs-admin-platform-client:
  pnpm-deps-cache-docs:

services:
  web:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extends:
      file: ./base.services.yml
      service: web
    environment:
      - PFDA_LOCAL_DOCKER_FILE_WATCHER_PATCH=1
      - RAILS_ENV=development
      - SKIP_DB_SETUP=${SKIP_DB_SETUP}
    volumes:
      - type: volume
        source: bundler-deps-cache-ruby
        target: /usr/local/bundle
  frontend:
    extends:
      file: ./base.services.yml
      service: frontend
    build:
      context: ../packages/client
      dockerfile: ./docker/images/dev.Dockerfile
    environment:
      - VITE_OUT_DIR=dist
    volumes:
      - type: volume
        source: vite-cache-client
        target: /precision-fda/node_modules/.vite/
      - type: bind
        source: ../packages/client/src
        target: /precision-fda/src
      - pnpm-store-cache:/root/.local/share/pnpm/store
      - pnpm-deps-cache-client:/precision-fda/node_modules
  docs:
    extends:
      file: ./base.services.yml
      service: docs
    volumes:
      - type: bind
        source: ../packages/docs
        target: /app
      - pnpm-store-cache:/root/.local/share/pnpm/store
      - pnpm-deps-cache-docs:/app/node_modules
  nodejs-api:
    extends:
      file: ./base.services.yml
      service: nodejs-api
    build:
      context: ../packages/server
      dockerfile: ./docker/images/dev.Dockerfile
    command: ["pnpm", "run", "start:dev:api"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=development
      - NODE_DATABASE_NAME=precision-fda
      - NODE_DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-password}@db:3306/precision-fda
      - NODE_DEV_WATCH=${NODE_DEV_WATCH:-1}
    volumes:
      - type: bind
        source: ../packages/server
        target: /app
      - pnpm-store-cache:/root/.local/share/pnpm/store
      - pnpm-deps-cache-nodejs-api:/app/node_modules

  nodejs-worker:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extends:
      file: ./base.services.yml
      service: nodejs-worker
    build:
      context: ../packages/server
      dockerfile: ./docker/images/dev.Dockerfile
    command: ["pnpm", "run", "start:dev:worker"]
    environment:
      - NODE_ENV=development
      - NODE_DATABASE_NAME=precision-fda
      - NODE_DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-password}@db:3306/precision-fda
      - NODE_DEV_WATCH=${NODE_DEV_WATCH:-1}
    volumes:
      - type: bind
        source: ../packages/server
        target: /app
      - pnpm-store-cache:/root/.local/share/pnpm/store
      - pnpm-deps-cache-nodejs-worker:/app/node_modules
  nodejs-admin-platform-client:
    extends:
      file: ./base.services.yml
      service: nodejs-admin-platform-client
    build:
      context: ../packages/server
      dockerfile: ./docker/images/dev.Dockerfile
    command: ["pnpm", "run", "start:dev:admin-platform-client"]
    environment:
      - NODE_ENV=development
      - NODE_DEV_WATCH=${NODE_DEV_WATCH:-1}
    volumes:
      - type: bind
        source: ../packages/server
        target: /app
      - pnpm-store-cache:/root/.local/share/pnpm/store
      - pnpm-deps-cache-nodejs-admin-platform-client:/app/node_modules
  db:
    extends:
      file: ./base.services.yml
      service: db
    volumes:
      - db-pfda-mysql-volume:/var/lib/mysql
  redis:
    extends:
      file: ./base.services.yml
      service: redis
  nginx:
    extends:
      file: ./base.services.yml
      service: nginx
    depends_on:
      nodejs-api:
        condition: service_started
      web:
        condition: service_started
      docs:
        condition: service_started
