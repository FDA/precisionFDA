packages:
  - 'packages/client'
  - 'packages/server'
  - 'packages/docs'

sharedWorkspaceLockfile: false

# pnpm 11 requires explicit approval for packages with install/postinstall scripts.
# Each per-package pnpm-workspace.yaml mirrors the relevant subset for Docker
# builds where only the package directory is in context.
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
