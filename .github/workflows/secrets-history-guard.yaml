name: Secrets History Guard

# Fails if a secrets.yml file exists anywhere in the git history of the
# branch being built. This prevents the purged config/secrets.yml (PFDA-7025)
# from being reintroduced via stale branches based on the pre-rewrite history.

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check-secrets-history:
    name: Check git history for secrets.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fail if secrets.yml exists anywhere in history
        run: |
          set -euo pipefail
          # For PRs check the head branch history; otherwise the pushed ref.
          REF="${{ github.event.pull_request.head.sha || github.sha }}"
          MATCHES=$(git log --format='%h %s' "$REF" --diff-filter=A -- '*secrets.yml' 'secrets.yml')
          if [ -n "$MATCHES" ]; then
            echo "::error::secrets.yml found in git history. This branch is based on the pre-rewrite history or reintroduces the file."
            echo "Offending commits (added secrets.yml):"
            echo "$MATCHES"
            echo ""
            echo "Files present in history:"
            git log --name-only --format='---- %h %s' "$REF" -- '*secrets.yml' 'secrets.yml' | grep -iv '^$' | head -50
            echo ""
            echo "Fix: re-create your branch on top of the rewritten master (see PFDA-7025 migration guide)."
            exit 1
          fi
          echo "OK: no secrets.yml found in history of $REF."

